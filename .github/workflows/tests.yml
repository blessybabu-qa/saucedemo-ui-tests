name: UI Tests

on:
  push:
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button on GitHub

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compile tests
        run: mvn -B test-compile

      - name: Install Chromium and its system dependencies
        run: >
          mvn -B exec:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install --with-deps chromium"

      - name: Run tests
        run: mvn -B test
        env:
          STANDARD_USER: ${{ secrets.STANDARD_USER }}
          LOCKED_OUT_USER: ${{ secrets.LOCKED_OUT_USER }}
          PROBLEM_USER: ${{ secrets.PROBLEM_USER }}
          PASSWORD: ${{ secrets.PASSWORD }}
          HEADLESS: true

      - name: Upload test reports
        if: always()   # upload even when tests fail, that's when you need them most
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/traces